id: sendqon
name: Sendqon (Zender)
version: "5.0.4"
description: WhatsApp & SMS messaging SaaS with shared inbox, campaigns and chatbots (Zender 5, self-hosted by Rektrs)
icon: https://serverkit.ai/imgs/template-icons/sendqon.png
website: https://zender.titansys.dev
categories:
  - messaging
  - communication
  - productivity

variables:
  - name: HTTP_PORT
    description: HTTP port
    type: port
    default: "8080"
    hidden: true
  - name: APP_URL
    description: Application URL
    default: https://sendqon.rektrs.com
    required: true
  - name: DB_PASSWORD
    description: MySQL password
    type: password
    generate: password

ports:
  - port: 8080
    protocol: tcp
    description: Web interface

volumes:
  - name: storage
    path: /var/www/zender/storage
    description: Sendqon storage (uploads, logs, app data)
  - name: db
    path: /var/lib/mysql
    description: MySQL data

requirements:
  memory: 4GB
  storage: 20GB

compose:
  services:
    app:
      image: sendqon:${VERSION:-5.0.4}
      container_name: ${APP_NAME}
      restart: unless-stopped
      environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - LOG_LEVEL=error
        - APP_URL=${APP_URL}
        - SESSION_SECURE_COOKIE=true
        - DB_CONNECTION=mysql
        - DB_HOST=db
        - DB_PORT=3306
        - DB_DATABASE=zender
        - DB_USERNAME=zender
        - DB_PASSWORD=${DB_PASSWORD}
        - CACHE_STORE=database
        - QUEUE_CONNECTION=database
      volumes:
        - sendqon_storage:/var/www/zender/storage
      ports:
        - "${HTTP_PORT}:80"
      depends_on:
        - db

    reverb:
      image: sendqon:${VERSION:-5.0.4}
      container_name: ${APP_NAME}-reverb
      restart: unless-stopped
      command: php artisan reverb:start --host=0.0.0.0 --port=8080
      environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - LOG_LEVEL=error
        - APP_URL=${APP_URL}
        - DB_CONNECTION=mysql
        - DB_HOST=db
        - DB_PORT=3306
        - DB_DATABASE=zender
        - DB_USERNAME=zender
        - DB_PASSWORD=${DB_PASSWORD}
        - CACHE_STORE=database
        - QUEUE_CONNECTION=database
      volumes:
        - sendqon_storage:/var/www/zender/storage
      ports:
        # Loopback only: the host Caddy reverse-proxies /app/* and /apps/*
        # (Reverb websocket + HTTP API) to this port for the public WSS path.
        - "127.0.0.1:${REVERB_PORT:-18080}:8080"
      depends_on:
        - db
        - app

    queue:
      image: sendqon:${VERSION:-5.0.4}
      container_name: ${APP_NAME}-queue
      restart: unless-stopped
      command: php artisan queue:work --tries=3 --timeout=300
      environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - LOG_LEVEL=error
        - APP_URL=${APP_URL}
        - DB_CONNECTION=mysql
        - DB_HOST=db
        - DB_PORT=3306
        - DB_DATABASE=zender
        - DB_USERNAME=zender
        - DB_PASSWORD=${DB_PASSWORD}
        - CACHE_STORE=database
        - QUEUE_CONNECTION=database
      volumes:
        - sendqon_storage:/var/www/zender/storage
      depends_on:
        - db
        - app

    scheduler:
      image: sendqon:${VERSION:-5.0.4}
      container_name: ${APP_NAME}-scheduler
      restart: unless-stopped
      command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
      environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - LOG_LEVEL=error
        - APP_URL=${APP_URL}
        - DB_CONNECTION=mysql
        - DB_HOST=db
        - DB_PORT=3306
        - DB_DATABASE=zender
        - DB_USERNAME=zender
        - DB_PASSWORD=${DB_PASSWORD}
        - CACHE_STORE=database
        - QUEUE_CONNECTION=database
      volumes:
        - sendqon_storage:/var/www/zender/storage
      depends_on:
        - db
        - app

    db:
      image: mysql:8
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        - MYSQL_DATABASE=zender
        - MYSQL_USER=zender
        - MYSQL_PASSWORD=${DB_PASSWORD}
      volumes:
        - sendqon_db:/var/lib/mysql

  volumes:
    sendqon_storage:
    sendqon_db:

post_install: |
  echo "Sendqon containers are up. One-time initialisation (app container):"
  echo "  php artisan key:generate --force        # writes APP_KEY into .env"
  echo "  CHANNEL_PLUGINS_CORE_ONLY=1 php artisan migrate --force --seed"
  echo "  php artisan channel-plugins:sync"
  echo "  php artisan zender:configure-realtime --driver=reverb --host=<domain> --port=443 --scheme=https --server-host=reverb --server-port=8080"
  echo "  php artisan storage:link"
  echo "Then finish the Zender web installer in the browser and create the"
  echo "admin account there. Keep error reporting (Sentry) OFF."
  echo "Public wiring: Caddy serves https://sendqon.rektrs.com -> app port,"
  echo "and /app/* + /apps/* -> 127.0.0.1 reverb port (see deploy design)."
